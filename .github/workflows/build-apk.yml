name: Build MAYA APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android shell and copy MAYA sources
        run: |
          unzip -q maya_ai_stage2_cloudbuild.zip
          flutter create --org com.maya --project-name maya_ai --platforms android shell
          rm -rf shell/lib
          cp -r maya_ai/app/lib shell/lib
          cp maya_ai/app/pubspec.yaml shell/pubspec.yaml
          M=shell/android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="MAYA AI"#' $M
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' $M
          for f in shell/android/app/build.gradle shell/android/app/build.gradle.kts; do
            [ -f "$f" ] && sed -i 's/flutter\.minSdkVersion/23/' "$f" || true
          done
      - name: Build APK
        working-directory: shell
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: MAYA-AI-apk
          path: shell/build/app/outputs/flutter-apk/app-release.apk
